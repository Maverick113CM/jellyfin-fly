app = "jellyfin-manuel"
primary_region = "fra"

[processes]
  app = "/usr/lib/jellyfin/bin/jellyfin --datadir /config/data --cachedir /config/cache --ffmpeg /usr/lib/jellyfin-ffmpeg/ffmpeg --webdir /usr/share/jellyfin/web"

[build]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[[services]]
  internal_port = 8096
  protocol = "tcp"
  processes = ["app"]

  [[services.tcp_checks]]
    interval = "0s"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[mounts]
  source = "jellyfin_data"
  destination = "/config"
