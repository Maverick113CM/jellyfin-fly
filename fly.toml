# fly.toml app configuration file generated for jellyfin-manuel on 2026-03-09T20:48:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jellyfin-manuel'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 8096
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
[[services]]
  internal_port = 8096
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
